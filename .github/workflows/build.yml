name: Build MT6765 Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: '内核源码仓库 URL'
        default: 'https://github.com/g4bri3ldll/motorola_source_code_hawaiip.git'
        required: true
      kernel_branch:
        description: '分支 / tag'
        default: 'main'
        required: true
      config_file:
        description: 'configs/ 下的配置文件名'
        default: 'ekvator.config'
        required: true
      clang_repo:
        description: 'clang 预编译仓库'
        default: 'https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r383902.git'
        required: true
      keep_vermagic_clean:
        description: '关闭 LOCALVERSION_AUTO，避免 vermagic 带 -g<hash>'
        type: boolean
        default: true
      build_ccache:
        description: '启用 ccache（第二次构建快 2-3 倍）'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison flex libssl-dev libelf-dev cpio rsync \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi device-tree-compiler lz4 zstd ccache

      - name: 拉取内核源码
        run: |
          git clone --depth=1 -b "${{ inputs.kernel_branch }}" \
            "${{ inputs.kernel_repo }}" kernel
          echo "源码 HEAD: $(git -C kernel rev-parse --short HEAD)"
          head -5 kernel/Makefile | grep -E 'VERSION|PATCHLEVEL|SUBLEVEL'

      - name: 拉取 clang 工具链
        run: |
          git clone --depth=1 "${{ inputs.clang_repo }}" clang
          ./clang/bin/clang --version | head -2

      - name: 恢复 ccache
        if: ${{ inputs.build_ccache }}
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ inputs.config_file }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.config_file }}-

      - name: 写入配置
        run: |
          mkdir -p kernel/out
          cp "configs/${{ inputs.config_file }}" kernel/out/.config
          if [ "${{ inputs.keep_vermagic_clean }}" = "true" ]; then
            sed -i 's|^CONFIG_LOCALVERSION_AUTO=y|# CONFIG_LOCALVERSION_AUTO is not set|' \
              kernel/out/.config
          fi
          echo "配置行数: $(wc -l < kernel/out/.config)"

      - name: olddefconfig
        working-directory: kernel
        env:
          CCACHE_DIR: ~/.ccache
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          make O=out ARCH=arm64 \
            CC="ccache clang" LLVM_IAS=0 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

      - name: 编译内核
        working-directory: kernel
        env:
          CCACHE_DIR: ~/.ccache
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          make O=out ARCH=arm64 \
            CC="ccache clang" LLVM_IAS=0 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            -j"$(nproc)"

      - name: 核对产物与 vermagic
        run: |
          B=kernel/out/arch/arm64/boot
          ls -lh "$B"/Image* 2>/dev/null || true
          echo "--- 构建出的内核版本 ---"
          strings "$B/Image" | grep -m1 '^Linux version' || echo "未找到版本串"
          echo "--- 原厂 vermagic 参照 ---"
          echo "4.19.127 SMP preempt mod_unload modversions aarch64"
          echo "--- ccache 统计 ---"
          ccache -s || true

      - name: 打包 boot.img
        run: |
          B=kernel/out/arch/arm64/boot
          mkdir -p artifacts
          if [ -f "$B/Image.gz" ]; then
            cp "$B/Image.gz" artifacts/Image.gz
          else
            gzip -9 -n -c "$B/Image" > artifacts/Image.gz
          fi
          cp "$B/Image" artifacts/Image
          python3 scripts/pack_bootimg.py \
            --kernel artifacts/Image.gz \
            --ramdisk prebuilt/ramdisk.gz \
            --dtb prebuilt/dtb \
            --output artifacts/boot.img
          ls -lh artifacts/

      - name: 保存构建日志
        if: failure()
        run: |
          mkdir -p artifacts
          cp kernel/out/.config artifacts/failed.config 2>/dev/null || true
          echo "构建失败，请查看上方日志"

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt6765-kernel-${{ github.run_number }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
