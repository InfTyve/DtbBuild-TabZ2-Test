name: Build Kernel
on: [workflow_dispatch]

env:
  KERNEL_REPO: https://github.com/plmzaq2112/android_kernel_mt6765.git
  KERNEL_BRANCH: 4.19.325-purity
  DEFCONFIG: blossom_defconfig
  CLANG_REPO: https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r383902

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h /
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev cpio rsync gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler lz4 zstd ccache
      - name: Clone kernel
        run: git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
      - name: Clone clang
        run: git clone --depth=1 "$CLANG_REPO" clang
      - name: Build
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export CCACHE_DIR="$HOME/.ccache"
          make O=out ARCH=arm64 CC="ccache clang" LLVM_IAS=0 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- "$DEFCONFIG"
          make O=out ARCH=arm64 CC="ccache clang" LLVM_IAS=0 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="-Wno-error" -j"$(nproc)"
      - name: Show version
        run: strings kernel/out/arch/arm64/boot/Image | grep -m1 'Linux version' || true
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: kernel/out/arch/arm64/boot/Image*
