name: Build Kernel (single file)
on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: '内核源码仓库 URL'
        default: 'https://github.com/plmzaq2112/android_kernel_mt6765.git'
        required: true
      kernel_branch:
        description: '分支'
        default: '4.19.325-purity'
        required: true
      defconfig:
        description: '源码树自带的 defconfig 名（arch/arm64/configs 下）'
        default: 'blossom_defconfig'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - name: 释放磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev \
            cpio rsync gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi device-tree-compiler lz4 zstd ccache

      - name: 拉取源码
        run: |
          git clone --depth=1 -b "${{ inputs.kernel_branch }}" \
            "${{ inputs.kernel_repo }}" kernel
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)' kernel/Makefile | head -3

      - name: 拉取 clang
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r383902 \
            clang
          ./clang/bin/clang --version | head -2

      - name: 编译
        working-directory: kernel
        env:
          CCACHE_DIR: ~/.ccache
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          make O=out ARCH=arm64 \
            CC="ccache clang" LLVM_IAS=0 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            "${{ inputs.defconfig }}"
          make O=out ARCH=arm64 \
            CC="ccache clang" LLVM_IAS=0 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" -j"$(nproc)"

      - name: 核对版本
        run: |
          strings kernel/out/arch/arm64/boot/Image | grep -m1 '^Linux version' || true

      - name: 打包
        run: |
          B=kernel/out/arch/arm64/boot
          mkdir -p artifacts
          cp "$B/Image" artifacts/Image
          if [ -f "$B/Image.gz" ]; then
            cp "$B/Image.gz" artifacts/Image.gz
          else
            gzip -9 -n -c "$B/Image" > artifacts/Image.gz
          fi
          if [ -f prebuilt/ramdisk.gz ] && [ -f prebuilt/dtb ] && [ -f scripts/pack_bootimg.py ]; then
            python3 scripts/pack_bootimg.py \
              --kernel artifacts/Image.gz \
              --ramdisk prebuilt/ramdisk.gz \
              --dtb prebuilt/dtb \
              --output artifacts/boot.img
          else
            echo "::warning::缺少 prebuilt 或打包脚本，本次只产出 Image / Image.gz"
          fi
          ls -lh artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.run_number }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
